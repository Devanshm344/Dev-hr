[build]
command = "npm run build"
publish = "dist"

[[redirects]]
from = "/api/*"
to = "${FASTAPI_BACKEND_URL}/api/:splat"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
